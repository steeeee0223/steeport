<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Steeport 咖啡廳室內配置</title>
  <desc id="description">木桌靠著臨街的開窗，左側有三組靠牆座位，中央是六人長桌。飲水區在右側吧台尾端，書架、掛畫和植物在後牆。</desc>
  <defs>
    <pattern id="floor" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M0 0h56M0 0v56" fill="none" stroke="#dfd4c4" stroke-width="1"/>
    </pattern>
    <pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#bb946c"/>
      <path d="M0 3h12M0 10h12" stroke="#a5805c" stroke-width=".5"/>
    </pattern>
    <linearGradient id="sun" x1="0" x2=".3" y1="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffdd94" stop-opacity=".53"/>
      <stop offset="1" stop-color="#ffdd94" stop-opacity="0"/>
    </linearGradient>
    <g id="chair">
      <rect x="-15" y="-15" width="30" height="30" rx="5" fill="#eadbc1" stroke="#7e6248" stroke-width="1.5"/>
      <path d="M-11 15h22" stroke="#7e6248" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="number">
      <circle r="13" fill="#364638"/>
    </g>
    <style>
      text { font-family: "PingFang TC", "Noto Sans CJK TC", sans-serif; fill: #2f352d; }
      .label { font-size: 16px; font-weight: 600; paint-order: stroke; stroke: #f5ede0; stroke-width: 4px; stroke-linejoin: round; }
      .small { font-size: 14px; fill: #656659; }
      .index { font-size: 13px; font-weight: 600; fill: #fffaf1; text-anchor: middle; dominant-baseline: central; }
      .item { font-size: 17px; font-weight: 600; }
      .wall { stroke: #51493c; stroke-width: 10; stroke-linecap: square; fill: none; }
      .furniture { stroke: #826349; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#f8f4ea"/>
  <path d="M64 48h1072" stroke="#b8b2a0"/>
  <text x="64" y="77" class="small" style="letter-spacing:3px">STEEPORT / CAFÉ STUDY</text>
  <text x="64" y="126" font-size="35" font-weight="600">咖啡廳室內配置</text>
  <text x="1136" y="123" class="small" text-anchor="end">俯視平面・概念配置</text>

  <rect x="72" y="160" width="842" height="61" rx="4" fill="#e7e7dc"/>
  <path d="M84 185h818" stroke="#c2c4b7" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="493" y="177" class="small" text-anchor="middle">街景</text>
  <rect x="72" y="220" width="842" height="548" fill="#f0e7d8"/>
  <rect x="72" y="220" width="842" height="548" fill="url(#floor)"/>
  <path d="M137 222h511l-72 168H207z" fill="url(#sun)"/>
  <path class="wall" d="M72 220h65M648 220h135M870 220h44v548H72V220"/>
  <path d="M137 219h511" stroke="#627c6d" stroke-width="3" stroke-dasharray="10 5"/>
  <path d="M137 219l-24-31h24m511 31 24-31h-24" fill="none" stroke="#627c6d" stroke-width="2"/>
  <text x="394" y="212" class="label" text-anchor="middle">向街敞開的窗</text>
  <path d="M870 220v85m-85-85a85 85 0 0 0 85 85" fill="none" stroke="#998b77" stroke-width="1.4"/>
  <text x="826" y="208" class="small" text-anchor="middle">入口</text>

  <g aria-label="窗邊座位">
    <rect x="137" y="231" width="511" height="54" rx="4" fill="url(#wood)" class="furniture"/>
    <use href="#chair" x="249" y="314"/><use href="#chair" x="392" y="314"/><use href="#chair" x="551" y="314"/>
    <rect x="358" y="240" width="53" height="34" rx="3" fill="#45504a" stroke="#29382f"/>
    <path d="M365 247h39m-35 20h31" stroke="#c2cbc0" stroke-width="2"/>
    <rect x="433" y="242" width="22" height="27" rx="2" fill="#626e68" transform="rotate(-9 443 255)"/>
    <rect x="461" y="246" width="22" height="25" rx="2" fill="#ead7aa" stroke="#916e4a" transform="rotate(9 471 258)"/>
    <use href="#number" x="156" y="257"/><text x="156" y="257" class="index">1</text>
  </g>

  <g aria-label="三組靠牆座位">
    <g fill="#a69d79" stroke="#6a6750" stroke-width="1.5">
      <rect x="90" y="352" width="48" height="75" rx="8"/>
      <rect x="90" y="447" width="48" height="75" rx="8"/>
      <rect x="90" y="542" width="48" height="75" rx="8"/>
    </g>
    <rect x="155" y="365" width="58" height="49" rx="9" fill="url(#wood)" class="furniture"/>
    <rect x="155" y="460" width="58" height="49" rx="9" fill="url(#wood)" class="furniture"/>
    <rect x="155" y="555" width="58" height="49" rx="9" fill="url(#wood)" class="furniture"/>
    <use href="#number" x="114" y="485"/><text x="114" y="485" class="index">3</text>
  </g>

  <g aria-label="六人公共長桌">
    <rect x="410" y="367" width="132" height="243" rx="9" fill="url(#wood)" class="furniture"/>
    <rect x="419" y="376" width="114" height="225" rx="5" fill="none" stroke="#d7b593" stroke-width="1.1"/>
    <use href="#chair" transform="translate(380 410) rotate(90)"/>
    <use href="#chair" transform="translate(380 488) rotate(90)"/>
    <use href="#chair" transform="translate(380 566) rotate(90)"/>
    <use href="#chair" transform="translate(572 410) rotate(-90)"/>
    <use href="#chair" transform="translate(572 488) rotate(-90)"/>
    <use href="#chair" transform="translate(572 566) rotate(-90)"/>
    <use href="#number" x="476" y="471"/><text x="476" y="471" class="index">2</text>
    <text x="476" y="505" font-size="16" font-weight="600" text-anchor="middle" fill="#34291e">公共長桌</text>
  </g>

  <g aria-label="長吧台和自助飲水區">
    <rect x="796" y="325" width="101" height="350" rx="4" fill="#dfd7c9" stroke="#aba28f"/>
    <rect x="754" y="325" width="51" height="350" rx="4" fill="url(#wood)" class="furniture"/>
    <rect x="851" y="373" width="39" height="67" rx="5" fill="#83948b" stroke="#526057"/>
    <path d="M860 381v51m10-46h13m-13 16h13m-13 16h13" stroke="#d8e1d8" stroke-width="2"/>
    <rect x="855" y="484" width="29" height="39" rx="4" fill="#c2c0af" stroke="#8f8b7b"/>
    <g aria-label="客用飲水壺和杯子">
      <rect x="759" y="603" width="40" height="54" rx="5" fill="#e8d7b9" stroke="#8a7154"/>
      <circle cx="779" cy="619" r="12" fill="#95afa6" stroke="#526b62" stroke-width="1.5"/>
      <path d="M775 618h8" stroke="#e2eee7" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="771" cy="641" r="5" fill="#f8f4ea" stroke="#8a7154"/>
      <circle cx="787" cy="641" r="5" fill="#f8f4ea" stroke="#8a7154"/>
    </g>
    <use href="#number" x="779" y="483"/><text x="779" y="483" class="index">4</text>
    <text x="775" y="539" class="label" text-anchor="middle" transform="rotate(-90 775 539)">長吧台</text>
  </g>

  <g aria-label="書架、掛畫和植物">
    <rect x="157" y="714" width="248" height="37" rx="3" fill="#87694e" stroke="#6d523e"/>
    <path d="M198 717v31m42-31v31m42-31v31m42-31v31m42-31v31" stroke="#c2a788" stroke-width="1.3"/>
    <use href="#number" x="282" y="686"/><text x="282" y="686" class="index">5</text>
    <g aria-label="後牆掛畫和落地盆栽">
      <rect x="558" y="751" width="86" height="12" rx="2" fill="#e9d4b4" stroke="#6d523e" stroke-width="2"/>
      <path d="M565 756h72" stroke="#a5805c" stroke-width="1"/>
      <circle cx="674" cy="725" r="20" fill="#b48967" stroke="#826349" stroke-width="1.5"/>
      <g fill="#697e58" stroke="#4d6341" stroke-width="1">
        <ellipse cx="674" cy="714" rx="7" ry="15" transform="rotate(14 674 714)"/>
        <ellipse cx="683" cy="726" rx="7" ry="14" transform="rotate(55 683 726)"/>
        <ellipse cx="669" cy="733" rx="7" ry="14" transform="rotate(29 669 733)"/>
        <ellipse cx="665" cy="721" rx="7" ry="13" transform="rotate(-53 665 721)"/>
      </g>
    </g>
    <use href="#number" x="621" y="680"/><text x="621" y="680" class="index">6</text>
  </g>

  <path d="M942 160v608" stroke="#d3cbbb"/>
  <text x="970" y="184" class="small" style="letter-spacing:2px">室內配置</text>
  <g transform="translate(981 225)">
    <use href="#number"/><text class="index">1</text>
    <text x="23" y="6" class="item">窗邊木桌</text><text x="23" y="30" class="small">筆電、筆記與手帳</text>
  </g>
  <g transform="translate(981 310)">
    <use href="#number"/><text class="index">2</text>
    <text x="23" y="6" class="item">公共長桌</text><text x="23" y="30" class="small">兩側各三席</text>
  </g>
  <g transform="translate(981 395)">
    <use href="#number"/><text class="index">3</text>
    <text x="23" y="6" class="item">靠牆座位</text><text x="23" y="30" class="small">三組獨立小桌</text>
  </g>
  <g transform="translate(981 480)">
    <use href="#number"/><text class="index">4</text>
    <text x="23" y="6" class="item">長吧台</text><text x="23" y="30" class="small">尾端設自助飲水區</text>
  </g>
  <g transform="translate(981 565)">
    <use href="#number"/><text class="index">5</text>
    <text x="23" y="6" class="item">書架</text><text x="23" y="30" class="small">後牆木層架</text>
  </g>
  <g transform="translate(981 650)">
    <use href="#number"/><text class="index">6</text>
    <text x="23" y="6" class="item">掛畫和植物</text><text x="23" y="30" class="small">後牆掛畫、落地盆栽</text>
  </g>

  <path d="M64 802h1072" stroke="#b8b2a0"/>
  <text x="64" y="828" class="small">午後自然光從街側進來</text>
  <text x="1136" y="828" class="small" text-anchor="end">配置示意・未標尺寸</text>
</svg>
