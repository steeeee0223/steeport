<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eadd" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="An afternoon café you can walk through. Take a seat, open a book, or explore the room."
    />
    <title>Steeport · The window seat</title>
  </head>
  <body class="immersive">
    <main class="shell">
      <header class="masthead">
        <div class="wordmark">
          <span class="brand-icon" aria-hidden="true">◩</span> Steeport<span
            class="brand-dot"
            >.</span
          >
        </div>
      </header>

      <section class="heading" aria-labelledby="title">
        <div>
          <p class="eyebrow"><span></span> AN AFTERNOON STUDY</p>
          <h1 id="title">The window seat<span>.</span></h1>
        </div>
        <div class="view-options">
          <button
            id="music"
            type="button"
            aria-label="Lo-fi music"
            aria-pressed="false"
            title="Play lo-fi music"
            hidden
          >
            ♫
          </button>
          <button
            id="view-switch"
            class="view-switch"
            type="button"
            aria-pressed="false"
            disabled
          >
            Pixel view
          </button>
        </div>
      </section>

      <section class="room-card" aria-label="Interactive café">
        <div id="viewport" class="viewport" aria-label="Café scene">
          <img
            id="preview"
            class="preview"
            src="/studies/window-seat.jpg"
            alt="Afternoon light at the open café window, with a laptop, mug and notebooks on the oak desk."
          />
          <div class="scene-header">
            <span id="view-label">01 / FIRST PERSON</span>
            <span id="location"
              ><span class="live-dot"></span
              ><span id="location-text">Window seat</span></span
            >
          </div>
          <div id="scene-notice" class="scene-message">
            <p id="scene-message" role="status">Opening the café…</p>
            <div id="fallback-actions" hidden>
              <button id="fallback-book" type="button"></button>
              <a href="/books/">Browse books</a>
              <a href="/studies/standing-turn.jpg">Standing Blender still</a>
            </div>
          </div>
          <div class="room-status">
            <span id="cup-state" hidden></span>
            <p id="feedback" role="status"></p>
          </div>
        </div>
        <div id="room-hud" class="room-hud" hidden>
          <div class="scene-input">
            <div
              id="touch-pad"
              class="touch-pad"
              aria-label="Movement controls"
              hidden
            >
              <button type="button" data-move="KeyW" aria-label="Move forward">
                ↑
              </button>
              <button type="button" data-move="KeyA" aria-label="Move left">
                ←
              </button>
              <button type="button" data-move="KeyS" aria-label="Move back">
                ↓
              </button>
              <button type="button" data-move="KeyD" aria-label="Move right">
                →
              </button>
            </div>
            <div
              id="orbit-controls"
              class="orbit-controls"
              aria-label="Camera controls"
              hidden
            >
              <button
                id="orbit-left"
                type="button"
                aria-label="Rotate camera left"
              >
                ↶
              </button>
              <button
                id="orbit-right"
                type="button"
                aria-label="Rotate camera right"
              >
                ↷
              </button>
              <button
                id="zoom-pixel"
                type="button"
                aria-label="Zoom in"
                aria-pressed="false"
                hidden
              >
                +
              </button>
            </div>
          </div>
          <div
            id="actions"
            class="actions"
            aria-label="Available actions"
            role="group"
          >
            <button id="seat" type="button" hidden>Stand up</button>
            <button id="crouch" type="button" aria-pressed="false" hidden>
              Crouch
            </button>
            <button id="laptop-focus" type="button" hidden>
              Look at laptop
            </button>
            <div id="prop-actions" class="action-group"></div>
            <button id="read-atlas" type="button" hidden>Read atlas</button>
            <button id="sip" type="button" hidden>Sip water</button>
            <button id="place-cup" type="button" hidden>Put down cup</button>
            <button id="place-atlas" type="button" hidden>
              Put down atlas
            </button>
            <button id="confirm-placement" type="button" hidden>
              Place here
            </button>
            <button id="cancel-placement" type="button" hidden>Cancel</button>
            <div id="screen-controls" class="action-group" hidden></div>
          </div>
        </div>
      </section>

      <dialog id="reader" aria-labelledby="book-title">
        <div class="book-spread">
          <div class="book-verso">
            <div class="bookplate">
              <svg viewBox="0 0 76 64" aria-hidden="true">
                <defs>
                  <g id="book-engraving">
                    <path
                      d="M14 51V27a24 24 0 0 1 48 0v24M19 51V27a19 19 0 0 1 38 0v24M10 51h56v5H10zM38 8v43M19 29h38M23 45l8-8m-8 3 3-3m18-13 5-5m-1 7 4-4M29 61h18"
                    />
                    <path d="M29 17c1-2 2-3 4-4m-3 50h16" />
                  </g>
                </defs>
                <use href="#book-engraving" />
              </svg>
              <h2 id="book-title"></h2>
            </div>
          </div>
          <div class="book-recto">
            <div
              id="book-page"
              class="book-entry"
              aria-live="polite"
              tabindex="0"
            ></div>
          </div>
          <div id="book-turn" aria-hidden="true" inert hidden>
            <div class="book-recto book-face book-front">
              <div id="turning-text" class="book-entry"></div>
            </div>
            <div class="book-verso book-face book-back">
              <div class="bookplate">
                <svg viewBox="0 0 76 64"><use href="#book-engraving" /></svg>
                <p id="turning-title" class="book-title"></p>
              </div>
            </div>
          </div>
          <button
            id="close-book"
            type="button"
            aria-label="Close book"
            aria-keyshortcuts="Escape"
          >
            <span aria-hidden="true">×</span>
          </button>
          <div class="reader-nav">
            <button
              id="previous-page"
              type="button"
              aria-label="Previous page"
              aria-keyshortcuts="ArrowLeft"
            >
              <span aria-hidden="true">←</span>
            </button>
            <div class="page-details">
              <span id="page-number"></span>
              <a id="share-book" href="/books/" lang="en"
                >Open shareable page</a
              >
            </div>
            <button
              id="next-page"
              type="button"
              aria-label="Next page"
              aria-keyshortcuts="ArrowRight"
            >
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
